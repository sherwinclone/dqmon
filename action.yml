name: 'dqmon - Data Quality Check'
description: 'Zero-config data quality monitoring for dbt projects'
branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  dbt-project-path:
    description: 'Path to dbt project directory'
    required: false
    default: '.'
  manifest-path:
    description: 'Path to manifest.json (default: auto-detect in target/)'
    required: false
  fail-on-warnings:
    description: 'Fail the action on warnings (not just errors)'
    required: false
    default: 'false'
  comment-on-pr:
    description: 'Post results as PR comment'
    required: false
    default: 'true'

outputs:
  passed:
    description: 'Number of checks that passed. Written from the markdown report, including when the step fails.'
    value: ${{ steps.check.outputs.passed }}
  warnings:
    description: 'Number of checks that warned. Written from the markdown report, including when the step fails.'
    value: ${{ steps.check.outputs.warnings }}
  failed:
    description: 'Number of checks that failed. Written from the markdown report, including when the step fails.'
    value: ${{ steps.check.outputs.failed }}
  report:
    description: 'Workspace-relative path of the markdown report (dqmon-report.md). Empty when no report file was written.'
    value: ${{ steps.check.outputs.report }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dqmon
      shell: bash
      run: pip install "${{ github.action_path }}"

    - name: Run dqmon check
      id: check
      shell: bash
      run: |
        set +e
        EXTRA_ARGS=()
        if [ "${{ inputs.fail-on-warnings }}" = "true" ]; then
          EXTRA_ARGS+=(--fail-on-warnings)
        fi
        dqmon report "${{ inputs.dbt-project-path }}" --output dqmon-report.md "${EXTRA_ARGS[@]}"
        EXIT_CODE=$?

        PASSED=0
        WARNINGS=0
        FAILED=0
        REPORT_PATH=""
        if [ -f dqmon-report.md ]; then
          REPORT_PATH="dqmon-report.md"
          RESULTS_LINE=$(grep -E '^\*\*Results:\*\*' dqmon-report.md || true)
          if [ -n "$RESULTS_LINE" ]; then
            PASSED=$(printf '%s\n' "$RESULTS_LINE" | sed -n 's/.*\*\*Results:\*\* \([0-9][0-9]*\) passed.*/\1/p')
            WARNINGS=$(printf '%s\n' "$RESULTS_LINE" | sed -n 's/.*| \([0-9][0-9]*\) warnings.*/\1/p')
            FAILED=$(printf '%s\n' "$RESULTS_LINE" | sed -n 's/.*| \([0-9][0-9]*\) failed.*/\1/p')
          fi
        fi

        {
          echo "passed=${PASSED:-0}"
          echo "warnings=${WARNINGS:-0}"
          echo "failed=${FAILED:-0}"
          echo "report=${REPORT_PATH}"
        } >> "$GITHUB_OUTPUT"

        exit "$EXIT_CODE"

    - name: Comment on PR
      if: inputs.comment-on-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'dqmon-report.md';
          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report
            });
          }
